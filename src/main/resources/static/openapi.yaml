openapi: 3.0.3
info:
  title: Rooming API
  version: 0.2.0
  description: Current HTTP surface exposed by the Spring controllers in this repository. Every path below is the literal controller URL path, including /api/v1 where the controller maps it.
servers:
  - url: http://localhost:8080
    description: Local Spring application root
tags:
  - name: Auth
    description: OAuth login entry points
  - name: Profile
    description: Authenticated user and broker profile APIs
  - name: Places
    description: Place search APIs
  - name: Target Places
    description: Seeker saved target-place APIs
  - name: Recommendation
    description: AI property recommendation APIs
  - name: Property
    description: Property read APIs
  - name: Broker
    description: Broker property APIs
  - name: Admin
    description: Admin property APIs
security:
  - bearerAuth: []
  - accessTokenCookie: []
paths:
  /api/v1/auth/seeker/google:
    get:
      tags: [Auth]
      summary: Start Google OAuth login for a seeker
      security: []
      responses:
        '302':
          description: Redirects to Google OAuth authorization.
          headers:
            Location:
              schema:
                type: string
              example: /oauth2/authorization/google
            Set-Cookie:
              schema:
                type: string
              example: ROOMING_OAUTH_ACCOUNT_TYPE=SEEKER; Path=/; HttpOnly; SameSite=Lax

  /api/v1/auth/broker/google:
    get:
      tags: [Auth]
      summary: Start Google OAuth login for a broker
      security: []
      responses:
        '302':
          description: Redirects to Google OAuth authorization.
          headers:
            Location:
              schema:
                type: string
              example: /oauth2/authorization/google
            Set-Cookie:
              schema:
                type: string
              example: ROOMING_OAUTH_ACCOUNT_TYPE=BROKER; Path=/; HttpOnly; SameSite=Lax

  /oauth2/redirect:
    get:
      tags: [Auth]
      summary: Render the local OAuth success redirect view
      description: View controller used by the configured OAuth success redirect URI.
      security: []
      parameters:
        - in: query
          name: accountType
          required: false
          schema:
            type: string
            enum: [SEEKER, BROKER]
        - in: query
          name: profileComplete
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: OAuth redirect page rendered.
          content:
            text/html:
              schema:
                type: string

  /api/v1/user/seeker/me:
    get:
      tags: [Profile]
      summary: Get the current seeker profile
      responses:
        '200':
          description: Seeker profile fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeekerProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/user/broker/me:
    get:
      tags: [Profile]
      summary: Get the current broker profile
      responses:
        '200':
          description: Broker profile fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerProfileResponse'
              example:
                success: true
                data:
                  brokerId: 12
                  email: broker12@rooming.example
                  name: Park Broker
                  accountType: BROKER
                  officeId: 4
                  officeName: SKKU Gate Realty
                  registrationNo: 123-45-67890
                  officePhone: 031-299-1100
                  officeAddress: 25 Seobu-ro 2126beon-gil, Jangan-gu, Suwon
                  phoneNumber: 010-1234-5678
                  hasVerificationDocument: true
                  verificationDocumentFileName: broker-registration.pdf
                  isVerified: false
                  profileComplete: true
                message: Broker profile fetched.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/user/broker/me/additional-info:
    put:
      tags: [Profile]
      summary: Upload required broker information for manual verification
      description: Multipart request. The additionalInfo part is JSON and the verificationDocument part is an image or PDF file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [additionalInfo, verificationDocument]
              properties:
                additionalInfo:
                  $ref: '#/components/schemas/BrokerAdditionalInfoRequest'
                verificationDocument:
                  type: string
                  format: binary
                  description: Broker registration image or PDF used for manual verification.
            encoding:
              additionalInfo:
                contentType: application/json
      responses:
        '200':
          description: Broker additional information updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerProfileResponse'
              example:
                success: true
                data:
                  brokerId: 12
                  email: broker12@rooming.example
                  name: Park Broker
                  accountType: BROKER
                  officeId: 4
                  officeName: SKKU Gate Realty
                  registrationNo: 123-45-67890
                  officePhone: 031-299-1100
                  officeAddress: 25 Seobu-ro 2126beon-gil, Jangan-gu, Suwon
                  phoneNumber: 010-1234-5678
                  hasVerificationDocument: true
                  verificationDocumentFileName: broker-registration.pdf
                  isVerified: false
                  profileComplete: true
                message: Broker additional information updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/broker-offices:
    get:
      tags: [Broker]
      summary: List broker offices selectable for broker additional information
      responses:
        '200':
          description: Broker office list fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerOfficeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Broker]
      summary: Create a broker office selectable for broker additional information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrokerOfficeCreateRequest'
            example:
              officeName: SKKU Gate Realty
              officePhone: 031-299-1100
              officeAddress: 25 Seobu-ro 2126beon-gil, Jangan-gu, Suwon
      responses:
        '201':
          description: Broker office saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerOfficeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/user/broker/me/properties:
    post:
      tags: [Broker]
      summary: Create a property for a manually verified broker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrokerPropertyCreateRequest'
            example:
              title: Quiet one-room near SKKU main gate
              propertyType: one_room
              transactionType: MONTHLY_RENT
              depositAmount: 500
              monthlyRent: 55
              maintenanceFee: 5
              areaM2: 23.5
              floorInfo: 3F
              roomCount: 1
              bathroomCount: 1
              direction: SOUTH
              availableFrom: '2026-06-01'
              description: Window faces a side street and the entry is keypad secured.
              roadAddress: 25 Seobu-ro 2126beon-gil, Jangan-gu, Suwon
              location:
                latitude: 37.29512
                longitude: 126.97184
      responses:
        '201':
          description: Property saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerPropertyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/places/search:
    get:
      tags: [Places]
      summary: Search places by keyword
      parameters:
        - in: query
          name: keyword
          required: true
          schema:
            type: string
          example: Sungkyunkwan University
      responses:
        '200':
          description: Place search completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/me/target-places:
    get:
      tags: [Target Places]
      summary: List the current seeker's target places
      responses:
        '200':
          description: Target place list fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetPlaceListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Target Places]
      summary: Create a target place for the current seeker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetPlaceCreateRequest'
            example:
              category: SCHOOL
              placeName: Sungkyunkwan University Natural Sciences Campus
              roadAddress: 2066 Seobu-ro, Jangan-gu, Suwon
              location:
                latitude: 37.29445
                longitude: 126.97479
              memo: First commute destination
      responses:
        '201':
          description: Target place saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetPlaceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/users/me/target-places/{targetPlaceId}:
    put:
      tags: [Target Places]
      summary: Update one target place for the current seeker
      parameters:
        - $ref: '#/components/parameters/targetPlaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetPlaceUpdateRequest'
            example:
              category: WORK_PLACE
              placeName: SKKU Startup Support Center
              roadAddress: 2066 Seobu-ro, Jangan-gu, Suwon
              location:
                latitude: 37.29508
                longitude: 126.97311
              memo: Weekday destination
      responses:
        '200':
          description: Target place updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetPlaceResponse'
              example:
                success: true
                data:
                  targetPlaceId: 29
                  category: WORK_PLACE
                  placeName: SKKU Startup Support Center
                  roadAddress: 2066 Seobu-ro, Jangan-gu, Suwon
                  location:
                    latitude: 37.29508
                    longitude: 126.97311
                  memo: Weekday destination
                message: Target place updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Target Places]
      summary: Delete one target place for the current seeker
      parameters:
        - $ref: '#/components/parameters/targetPlaceId'
      responses:
        '204':
          description: Target place deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/recommendations:
    get:
      tags: [Recommendation]
      summary: List AI result snapshots saved for the current seeker
      responses:
        '200':
          description: Recommendation list fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Recommendation]
      summary: Get and save AI-based property recommendations
      description: Frontend sends a recommendation query here. The backend calls the AI server with ids, saves the enriched recommendation snapshots, and returns frontend-ready results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
            example:
              query: Find a quiet one-room with a short commute to my first target place.
              preferences:
                - low maintenance fee
                - pharmacy nearby
                - subway access
              topN: 3
      responses:
        '200':
          description: Recommendations fetched and saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'

  /api/v1/recommendations/favorites:
    get:
      tags: [Recommendation]
      summary: List saved recommendation results marked favorite by the current seeker
      responses:
        '200':
          description: Favorite recommendations fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteRecommendationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/recommendations/{recommendationId}:
    delete:
      tags: [Recommendation]
      summary: Delete one saved recommendation for the current seeker
      parameters:
        - $ref: '#/components/parameters/recommendationId'
      responses:
        '204':
          description: Recommendation deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/recommendations/{recommendationId}/favorite:
    post:
      tags: [Recommendation]
      summary: Mark a saved recommendation as favorite
      parameters:
        - $ref: '#/components/parameters/recommendationId'
      responses:
        '200':
          description: Recommendation marked as favorite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Recommendation]
      summary: Remove favorite state from a saved recommendation
      parameters:
        - $ref: '#/components/parameters/recommendationId'
      responses:
        '204':
          description: Recommendation favorite removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/properties:
    get:
      tags: [Property]
      summary: List properties
      description: This controller returns the raw JSON array from propertyService.getAll() rather than an ApiResponse wrapper.
      responses:
        '200':
          description: Property list fetched.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Property'
              example:
                - propertyId: 101
                  title: Campus-side one-room 3F
                  address: 25 Seobu-ro 2126beon-gil, Jangan-gu, Suwon
                  latitude: null
                  longitude: null
                  deposit: 500
                  monthlyRent: 45
                  areaM2: 20.5
                  roomType: one_room
                  floorInfo: 3F
                  maintenanceFee: null
                  description: null
                  has3DModel: true
                  splineUrl: https://prod.spline.design/example-room/scene.splinecode
                  imageUrls:
                    - /images/101_room_main.png
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/properties/{id}:
    get:
      tags: [Property]
      summary: Get property details
      parameters:
        - $ref: '#/components/parameters/propertyReadId'
      responses:
        '200':
          description: Property detail fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/properties/{id}/images:
    get:
      tags: [Property]
      summary: Get property images
      parameters:
        - $ref: '#/components/parameters/propertyReadId'
      responses:
        '200':
          description: Property images fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyImagesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/properties/{id}/3d:
    get:
      tags: [Property]
      summary: Get property 3D asset metadata
      parameters:
        - $ref: '#/components/parameters/propertyReadId'
      responses:
        '200':
          description: Property 3D metadata fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property3DResponseWrapper'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/properties:
    post:
      tags: [Admin]
      summary: Create a property through the admin endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreatePropertyRequest'
            example:
              title: Campus-side one-room 3F
              address: 25 Seobu-ro 2126beon-gil, Jangan-gu, Suwon
              latitude: 37.29512
              longitude: 126.97184
              deposit: 500
              monthlyRent: 55
              maintenanceFee: 5
              areaM2: 23.5
              roomType: one_room
              floorInfo: 3F
              description: Admin seeded sample property.
      responses:
        '201':
          description: Property created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleSuccessResponse'
              example:
                success: true
                message: 留ㅻЪ ?깅줉 ?깃났
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/properties/{propertyId}:
    patch:
      tags: [Admin]
      summary: Update a property through the admin endpoint
      parameters:
        - $ref: '#/components/parameters/propertyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdatePropertyRequest'
            example:
              monthlyRent: 53
              maintenanceFee: 6
              description: Rent adjusted after broker confirmation.
      responses:
        '200':
          description: Property updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleSuccessResponse'
              example:
                success: true
                message: 留ㅻЪ ?섏젙 ?깃났
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/admin/properties/{propertyId}/3d:
    post:
      tags: [Admin]
      summary: Attach or update a 3D asset for a property
      parameters:
        - $ref: '#/components/parameters/propertyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProperty3DRequest'
            example:
              modelType: spline
              modelUrl: https://prod.spline.design/example-room/scene.splinecode
              previewImageUrl: https://cdn.rooming.test/properties/101/3d-preview.png
      responses:
        '201':
          description: 3D asset saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleSuccessResponse'
              example:
                success: true
                message: 3D ?먯궛 ?깅줉 ?깃났
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: ROOMING_ACCESS_TOKEN

  parameters:
    propertyReadId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
      example: 101
    propertyId:
      in: path
      name: propertyId
      required: true
      schema:
        type: integer
        format: int64
      example: 101
    recommendationId:
      in: path
      name: recommendationId
      required: true
      schema:
        type: integer
        format: int64
      example: 1
    targetPlaceId:
      in: path
      name: targetPlaceId
      required: true
      schema:
        type: integer
        format: int64
      example: 10

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is required.
    Forbidden:
      description: Authenticated account type is not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflicts with existing data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: Upstream service failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    SimpleSuccessResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    ErrorResponse:
      type: object
      required: [success, errorCode, message]
      properties:
        success:
          type: boolean
          example: false
        errorCode:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: Request body is invalid.

    CoordinateDto:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 37.2945
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 126.9748

    SeekerProfileResponse:
      type: object
      required: [success, data, message]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/SeekerProfileData'
        message:
          type: string
          example: User profile fetched.
      example:
        success: true
        data:
          userId: 7
          email: seeker7@skku.example
          name: Kim Seeker
          accountType: SEEKER
        message: User profile fetched.

    SeekerProfileData:
      type: object
      required: [userId, email, name, accountType]
      properties:
        userId:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: seeker@example.com
        name:
          type: string
          example: Alice
        accountType:
          type: string
          enum: [SEEKER]

    BrokerProfileResponse:
      type: object
      required: [success, data, message]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/BrokerProfileData'
        message:
          type: string
          example: Broker profile fetched.
      example:
        success: true
        data:
          brokerId: 12
          email: broker12@rooming.example
          name: Park Broker
          accountType: BROKER
          officeId: 4
          officeName: SKKU Gate Realty
          registrationNo: 123-45-67890
          officePhone: 031-299-1100
          officeAddress: 25 Seobu-ro 2126beon-gil, Jangan-gu, Suwon
          phoneNumber: 010-1234-5678
          hasVerificationDocument: true
          verificationDocumentFileName: broker-registration.pdf
          isVerified: false
          profileComplete: true
        message: Broker profile fetched.

    BrokerProfileData:
      type: object
      required:
        - brokerId
        - email
        - name
        - accountType
        - hasVerificationDocument
        - isVerified
        - profileComplete
      properties:
        brokerId:
          type: integer
          format: int64
          example: 3
        email:
          type: string
          format: email
          example: broker12@rooming.example
        name:
          type: string
