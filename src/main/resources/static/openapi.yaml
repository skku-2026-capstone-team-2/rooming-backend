      properties:
        officeId:
          type: integer
          format: int64
          nullable: true
          description: Existing broker office id selected from /api/v1/broker-offices. Null is allowed when the broker is not linked to a saved office.
          example: 12
        registrationNo:
          type: string
          minLength: 1
          description: Broker/business registration number used for manual verification.
          example: 123-45-67890
        phoneNumber:
          type: string
          minLength: 1
          description: Broker contact phone number.
