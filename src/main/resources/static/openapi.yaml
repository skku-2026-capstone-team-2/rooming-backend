openapi: 3.0.3
info:
  title: Rooming API
  version: 0.2.0
  description: Current HTTP surface exposed by the Spring controllers in this repository. Every path below is the literal controller URL path, including /api/v1 where the controller maps it.
servers:
  - url: https://rooming.cloud
    description: Production HTTPS backend
  - url: http://localhost:8080
    description: Local Spring application root
tags:
  - name: Auth
    description: OAuth login entry points
  - name: Profile
    description: Authenticated user and broker profile APIs
  - name: Target Places
    description: Seeker saved target-place APIs
  - name: Recommendation
    description: AI property recommendation APIs
  - name: Property
    description: Property read APIs
  - name: Broker
    description: Broker property APIs
security:
  - bearerAuth: []
  - accessTokenCookie: []
paths:
  /api/v1/auth/seeker/google:
    get:
      tags: [Auth]
      summary: Start Google OAuth login for a seeker
      security: []
      responses:
        '302':
          description: Redirects to Google OAuth authorization.
          headers:
            Location:
              schema:
                type: string
              example: /oauth2/authorization/google
            Set-Cookie:
              schema:
                type: string
              example: ROOMING_OAUTH_ACCOUNT_TYPE=SEEKER; Path=/; HttpOnly; Secure; SameSite=None

  /api/v1/auth/broker/google:
    get:
      tags: [Auth]
      summary: Start Google OAuth login for a broker
      security: []
      responses:
        '302':
          description: Redirects to Google OAuth authorization.
          headers:
            Location:
              schema:
                type: string
              example: /oauth2/authorization/google
            Set-Cookie:
              schema:
                type: string
              example: ROOMING_OAUTH_ACCOUNT_TYPE=BROKER; Path=/; HttpOnly; Secure; SameSite=None

  /api/v1/user/seeker/me:
    get:
      tags: [Profile]
      summary: Get the current seeker profile
      responses:
        '200':
          description: User profile fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeekerProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/user/broker/me:
    get:
      tags: [Profile]
      summary: Get the current broker profile
      responses:
        '200':
          description: Broker profile fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerProfileResponse'
              example:
                success: true
                data:
                  brokerId: 12
                  email: broker12@rooming.example
                  name: Park Broker
                  accountType: BROKER
                  officeId: 4
                  officeName: SKKU Gate Realty
                  registrationNo: 123-45-67890
                  officePhone: 031-299-1100
                  officeAddress: 25 Seobu-ro 2126beon-gil, Jangan-gu, Suwon
                  phoneNumber: 010-1234-5678
                  hasVerificationDocument: true
                  verificationDocumentFileName: broker-registration.pdf
                  isVerified: false
                  profileComplete: true
                message: Broker profile fetched.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/user/broker/me/additional-info:
    put:
      tags: [Profile]
      summary: Save required broker information for manual verification
      description: JSON request used before a broker can post properties. Send registrationNo, phoneNumber, and optional officeId in the request body. Upload the verification document separately at /api/v1/user/broker/me/verification-document. Developers/admins review registrationNo and the uploaded document manually, then set the broker's isVerified flag directly in the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrokerAdditionalInfoRequest'
            example:
              officeId: 4
              registrationNo: 123-45-67890
              phoneNumber: 010-1234-5678
      responses:
        '200':
          description: Broker additional information updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerProfileResponse'
              example:
                success: true
                data:
                  brokerId: 12
                  email: broker12@rooming.example
                  name: Park Broker
                  accountType: BROKER
                  officeId: 4
                  officeName: SKKU Gate Realty
                  registrationNo: 123-45-67890
                  officePhone: 031-299-1100
                  officeAddress: 25 Seobu-ro 2126beon-gil, Jangan-gu, Suwon
                  phoneNumber: 010-1234-5678
                  hasVerificationDocument: false
                  verificationDocumentFileName: null
                  isVerified: false
                  profileComplete: false
                message: Broker additional information updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  /api/v1/user/broker/me/verification-document:
    put:
      tags: [Profile]
      summary: Upload broker verification document for manual verification
      description: Multipart request for the broker registration document. This endpoint only receives the file. Send registrationNo and phoneNumber separately to /api/v1/user/broker/me/additional-info.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [verificationDocument]
              properties:
                verificationDocument:
                  type: string
                  format: binary
                  description: Broker registration document file. Accepts image or PDF upload for manual verification.
            example:
              verificationDocument: broker-registration.pdf
      responses:
        '200':
          description: Broker verification document updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerProfileResponse'
              example:
                success: true
                data:
                  brokerId: 12
                  email: broker12@rooming.example
                  name: Park Broker
                  accountType: BROKER
                  officeId: 4
                  officeName: SKKU Gate Realty
                  registrationNo: 123-45-67890
                  officePhone: 031-299-1100
                  officeAddress: 25 Seobu-ro 2126beon-gil, Jangan-gu, Suwon
                  phoneNumber: 010-1234-5678
                  hasVerificationDocument: true
                  verificationDocumentFileName: broker-registration.pdf
                  isVerified: false
                  profileComplete: true
                message: Broker verification document updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'

  /api/v1/broker-offices:
    get:
      tags: [Broker]
      summary: List broker offices selectable for broker additional information
      responses:
        '200':
          description: Broker office list fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerOfficeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Broker]
      summary: Create a broker office selectable for broker additional information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrokerOfficeCreateRequest'
            example:
              officeName: SKKU Gate Realty
              officePhone: 031-299-1100
              officeAddress: 25 Seobu-ro 2126beon-gil, Jangan-gu, Suwon
      responses:
        '201':
          description: Broker office saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerOfficeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/broker/me/properties:
    get:
      tags: [Broker]
      summary: List properties registered by the current broker
      responses:
        '200':
          description: Broker property list fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerPropertyListResponse'
              example:
                success: true
                data:
                  - propertyId: 2
                    title: 캠퍼스빌 502호
                  - propertyId: 1
                    title: Campus-side one-room 3F
                message: Broker property list fetched.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/user/broker/me/properties:
    post:
      tags: [Broker]
      summary: Create a property for a manually verified broker
      description: tradeType is always MONTHLY_RENT or DEPOSIT_BASIS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrokerPropertyCreateRequest'
            example:
              title: 캠퍼스빌 502호
              propertyType: one_room
              tradeType: MONTHLY_RENT
              depositAmount: 300
              monthlyRent: 48
              tags: [캠퍼스, 원룸]
              areaM2: 18.0
              floorInfo: 5층
              roomCount: 1
              bathroomCount: 1
              description: 캠퍼스 접근성이 좋은 원룸입니다.
              splineUrl: https://prod.spline.design/example-room/scene.splinecode
              roadAddress: 경기도 수원시 장안구 천천동 45-2
              location:
                latitude: 37.2992
                longitude: 126.9780
      responses:
        '201':
          description: Property saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrokerPropertyResponse'
              example:
                success: true
                data:
                  propertyId: 2
                  title: 캠퍼스빌 502호
                  propertyType: one_room
                  roadAddress: 경기도 수원시 장안구 천천동 45-2
                  location:
                    latitude: 37.2992
                    longitude: 126.978
                  tradeType: MONTHLY_RENT
                  depositAmount: 300
                  monthlyRent: 48
                  maintenanceFee: null
                  areaM2: 18.0
                  floorInfo: 5층
                  description: 캠퍼스 접근성이 좋은 원룸입니다.
                  tags: [캠퍼스, 원룸]
                  hasProperty3D: true
                  splineUrl: https://prod.spline.design/example-room/scene.splinecode
                message: Property saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/user/seeker/target-place:
    get:
      tags: [Target Places]
      summary: List the current seeker's target places
      responses:
        '200':
          description: Target place list fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetPlaceListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Target Places]
      summary: Create a target place for the current seeker
      description: category is always SCHOOL, WORK_PLACE, HOME, SUBWAY_STATION, BUS_TERMINAL or ETC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetPlaceCreateRequest'
            example:
              category: SCHOOL
              placeName: 성균관대학교 자연과학캠퍼스
              roadAddress: 경기도 수원시 장안구 서부로 2066
              location:
                latitude: 37.29445
                longitude: 126.97479
              memo: 주요 통학 목적지
      responses:
        '201':
          description: Target place saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetPlaceResponse'
              example:
                success: true
                data:
                  targetPlaceId: 1
                  category: SCHOOL
                  placeName: 성균관대학교 자연과학캠퍼스
                  roadAddress: 경기도 수원시 장안구 서부로 2066
                  location:
                    latitude: 37.29445
                    longitude: 126.97479
                  memo: 주요 통학 목적지
                message: Target place saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/user/seeker/target-place/{targetPlaceId}:
    put:
      tags: [Target Places]
      summary: Update one target place for the current seeker
      parameters:
        - $ref: '#/components/parameters/targetPlaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetPlaceUpdateRequest'
            example:
              category: WORK_PLACE
              placeName: SKKU Startup Support Center
              roadAddress: 2066 Seobu-ro, Jangan-gu, Suwon
              location:
                latitude: 37.29508
                longitude: 126.97311
              memo: Weekday destination
      responses:
        '200':
          description: Target place updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetPlaceResponse'
              example:
                success: true
                data:
                  targetPlaceId: 29
                  category: WORK_PLACE
                  placeName: SKKU Startup Support Center
                  roadAddress: 2066 Seobu-ro, Jangan-gu, Suwon
                  location:
                    latitude: 37.29508
                    longitude: 126.97311
                  memo: Weekday destination
                message: Target place updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Target Places]
      summary: Delete one target place for the current seeker
      parameters:
        - $ref: '#/components/parameters/targetPlaceId'
      responses:
        '204':
          description: Target place deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/recommendations:
    get:
      tags: [Recommendation]
      summary: List AI result snapshots saved for the current seeker
      responses:
        '200':
          description: Recommendation list fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Recommendation]
      summary: Get and save AI-based property recommendations
      description: Frontend sends a recommendation query here. The backend calls the AI server with the current seeker's ID, saves the enriched recommendation snapshots, and returns frontend-ready results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
            example:
              query: Find a quiet one-room with a short commute to my first target place.
              preferences:
                - low maintenance fee
                - pharmacy nearby
                - subway access
              topN: 3
      responses:
        '200':
          description: Recommendations fetched and saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'

  /api/v1/recommendations/favorites:
    get:
      tags: [Recommendation]
      summary: List saved recommendation results marked favorite by the current seeker
      responses:
        '200':
          description: Favorite recommendations fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteRecommendationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/recommendations/{recommendationId}:
    delete:
      tags: [Recommendation]
      summary: Delete one saved recommendation for the current seeker
      parameters:
        - $ref: '#/components/parameters/recommendationId'
      responses:
        '204':
          description: Recommendation deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/recommendations/{recommendationId}/route:
    get:
      tags: [Recommendation]
      summary: Get map geometry for one saved recommendation route
      description: Normal recommendation responses include route summaries only. Load this endpoint when the route map needs point geometry. SUMMARY returns simplified geometry with at most 100 points; DETAIL returns simplified geometry with at most 300 points.
      parameters:
        - $ref: '#/components/parameters/recommendationId'
        - in: query
          name: detail
          required: false
          description: Geometry density for the map zoom or screen state.
          schema:
            $ref: '#/components/schemas/RouteGeometryDetail'
      responses:
        '200':
          description: Recommendation route fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationRouteDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/recommendations/{recommendationId}/favorite:
    post:
      tags: [Recommendation]
      summary: Mark a saved recommendation as favorite
      parameters:
        - $ref: '#/components/parameters/recommendationId'
      responses:
        '200':
          description: Recommendation marked as favorite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Recommendation]
      summary: Remove favorite state from a saved recommendation
      parameters:
        - $ref: '#/components/parameters/recommendationId'
      responses:
        '204':
          description: Recommendation favorite removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/properties:
    get:
      tags: [Property]
      summary: List properties
      responses:
        '200':
          description: Property list fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyListResponse'
              example:
                success: true
                data:
                  - propertyId: 101
                    title: Campus-side one-room 3F
                    address: 25 Seobu-ro 2126beon-gil, Jangan-gu, Suwon
                    latitude: 37.29512
                    longitude: 126.97184
                    tradeType: MONTHLY_RENT
                    deposit: 500
                    monthlyRent: 45
                    areaM2: 20.5
                    roomType: one_room
                    floorInfo: 3F
                    maintenanceFee: null
                    description: Campus-side one-room near SKKU.
                    tags: [campus, one-room]
                    has3DModel: true
                    splineUrl: https://prod.spline.design/example-room/scene.splinecode
                    imageUrls:
                      - /images/101_room_main.png
                message: Property list fetched.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/properties/{id}:
    get:
      tags: [Property]
      summary: Get property details
      parameters:
        - $ref: '#/components/parameters/propertyReadId'
      responses:
        '200':
          description: Property detail fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/properties/{id}/images:
    get:
      tags: [Property]
      summary: Get property images
      parameters:
        - $ref: '#/components/parameters/propertyReadId'
      responses:
        '200':
          description: Property images fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyImagesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Property]
      summary: Upload property images
      description: Authenticated broker owner uploads image files. The server stores the files in S3 and returns image URLs.
      parameters:
        - $ref: '#/components/parameters/propertyReadId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  description: One or more property image files.
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Property images saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyImagesResponse'
              example:
                success: true
                data:
                  propertyId: 103
                  images:
                    - imageId: 1
                      imageUrl: https://rooming-property-image.s3.ap-northeast-2.amazonaws.com/properties/103/images/example-main.png
                      imageOrder: 1
                    - imageId: 2
                      imageUrl: https://rooming-property-image.s3.ap-northeast-2.amazonaws.com/properties/103/images/example-bath.png
                      imageOrder: 2
                message: Property images saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/properties/{id}/images/{imageId}:
    delete:
      tags: [Property]
      summary: Delete one property image
      description: imageId is the current 1-based image order returned by the property images API.
      parameters:
        - $ref: '#/components/parameters/propertyReadId'
        - $ref: '#/components/parameters/propertyImageId'
      responses:
        '200':
          description: Property image deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyImagesResponse'
              example:
                success: true
                data:
                  propertyId: 103
                  images:
                    - imageId: 1
                      imageUrl: https://rooming-property-image.s3.ap-northeast-2.amazonaws.com/properties/103/images/example-bath.png
                      imageOrder: 1
                message: Property image deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/properties/{id}/3d:
    get:
      tags: [Property]
      summary: Get property 3D asset metadata
      parameters:
        - $ref: '#/components/parameters/propertyReadId'
      responses:
        '200':
          description: Property 3D metadata fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property3DResponseWrapper'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: ROOMING_ACCESS_TOKEN

  parameters:
    propertyReadId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
      example: 101
    propertyImageId:
      in: path
      name: imageId
      required: true
      description: Current 1-based image id/order from the property images response.
      schema:
        type: integer
        minimum: 1
      example: 2
    propertyId:
      in: path
      name: propertyId
      required: true
      schema:
        type: integer
        format: int64
      example: 101
    recommendationId:
      in: path
      name: recommendationId
      required: true
      schema:
        type: integer
        format: int64
      example: 1
    targetPlaceId:
      in: path
      name: targetPlaceId
      required: true
      schema:
        type: integer
        format: int64
      example: 10

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated account type is not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflicts with existing data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: HTTP method is not supported for this path.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: Request content type is not supported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Uploaded file is too large.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: Upstream service failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    SimpleSuccessResponse:
      type: object
      required: [success, data, message]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          nullable: true
        message:
          type: string

    ErrorResponse:
      type: object
      description: Error bodies contain only the error message and the server-local creation time. HTTP status is returned as the response status code.
      required: [message, time]
      properties:
        message:
          type: string
          example: Request body is invalid.
        time:
          type: string
          format: date-time
          example: '2026-05-22T10:15:30.123456'

    CoordinateDto:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 37.2945
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 126.9748

    SeekerProfileResponse:
      type: object
      required: [success, data, message]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/SeekerProfileData'
        message:
          type: string
          example: User profile fetched.
      example:
