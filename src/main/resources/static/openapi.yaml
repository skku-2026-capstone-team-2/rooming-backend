    BrokerProfileData:
      type: object
      required:
        - brokerId
        - email
        - name
        - accountType
        - hasVerificationDocument
        - isVerified
        - profileComplete
      properties:
        brokerId:
          type: integer
          format: int64
          example: 3
        email:
          type: string
          format: email
          example: broker12@rooming.example
        name:
          type: string
          example: Park Broker
        accountType:
          type: string
          description: Account type enum. Broker profile always returns BROKER.
          enum: [BROKER]
        officeId:
          type: integer
          format: int64
          nullable: true
          example: 4
        officeName:
          type: string
          nullable: true
          example: SKKU Gate Realty
        registrationNo:
          type: string
          nullable: true
          description: Broker/business registration number submitted through additional-info.
          example: 123-45-67890
        officePhone:
          type: string
          nullable: true
          example: 031-299-1100
        officeAddress:
          type: string
          nullable: true
          example: 25 Seobu-ro 2126beon-gil, Jangan-gu, Suwon
        phoneNumber:
          type: string
          nullable: true
          example: 010-1234-5678
        hasVerificationDocument:
          type: boolean
          description: True when a verificationDocument file has been uploaded.
        verificationDocumentFileName:
          type: string
          nullable: true
          description: Original uploaded verification document file name, if present.
          example: broker-registration.pdf
        isVerified:
          type: boolean
          description: Manual verification status. Developers/admins set this in the database after checking registrationNo and verificationDocument.
        profileComplete:
          type: boolean
          description: True when registrationNo, phoneNumber, and verificationDocument have all been submitted.

    BrokerAdditionalInfoRequest:
