      example:
        success: true
        data:
          recommendationId: 7001
          propertyId: 101
          targetPlaceId: 29
          transportMode: PUBLIC_TRANSPORT
          durationMinutes: 18
          detail: DETAIL
          path:
            totalTime: 18
            transferCount: 1
            totalPointCount: 5
            pathList:
              - type: WALK
                trafficType: 3
                time: 4
                startName: Sungkyunkwan University
                endName: SKKU gate bus stop
                distance: 250
                points:
                  - latitude: 37.2945
                    longitude: 126.9748
                  - latitude: 37.295
                    longitude: 126.9739
              - type: BUS
                trafficType: 2
                time: 14
                startName: SKKU gate bus stop
                endName: Property stop
                lane: 62-1
                distance: 1570
                points:
                  - latitude: 37.295
                    longitude: 126.9739
                  - latitude: 37.2959
                    longitude: 126.973
                  - latitude: 37.2961
                    longitude: 126.9718
        message: Recommendation route fetched.

    RecommendationData:
      type: object
      required: [message, results]
      properties:
        message:
          type: string
          example: Recommendation completed.
        results:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationResult'

    RecommendationListData:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationResult'

    FavoriteRecommendationData:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationResult'

    RecommendationResult:
      type: object
      required:
        - recommendationId
        - propertyId
        - favorite
        - property
        - infrastructures
      properties:
        recommendationId:
          type: integer
          format: int64
          example: 41
        propertyId:
          type: integer
          format: int64
          example: 101
        favorite:
          type: boolean
          example: false
        property:
          $ref: '#/components/schemas/RecommendationPropertyDetails'
        firstTargetPlaceRoute:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RecommendationTargetPlaceRoute'
        infrastructures:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationInfrastructureDetails'
        explanation:
          type: string
          nullable: true
          example: Quiet studio with a short route to the requested places.

    RecommendationPropertyDetails:
      type: object
      required: [location, tradeType, depositAmount, monthlyRent, maintenanceFee]
      properties:
        title:
          type: string
          nullable: true
          example: Campus-side one-room 3F
        location:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CoordinateDto'
        tradeType:
          type: string
          description: Enum string. MONTHLY_RENT means monthly rent with deposit and monthly rent values. DEPOSIT_BASIS means deposit-basis rent and monthlyRent is 0.
          enum: [MONTHLY_RENT, DEPOSIT_BASIS]
          example: MONTHLY_RENT
        depositAmount:
          type: integer
          nullable: true
          example: 500
        monthlyRent:
          type: integer
          nullable: true
          example: 55
        maintenanceFee:
          type: integer
          nullable: true
          example: 5
        description:
          type: string
          nullable: true
          example: Quiet studio near campus.
        tags:
          type: array
          nullable: true
          items:
            type: string
          example: [quiet, campus]

    RecommendationTargetPlaceRoute:
      type: object
      description: Summary route data for recommendation cards and lists. Point geometry is loaded from the recommendation route endpoint only when a map view needs it.
      required: [targetPlaceId, transportMode, durationMinutes, transferCount, subPaths]
      properties:
        targetPlaceId:
          type: integer
          format: int64
          example: 29
        transportMode:
          type: string
          description: Enum string. PUBLIC_TRANSPORT routes come from ODSAY. WALK routes come from TMAP pedestrian routing for close destinations.
          enum: [PUBLIC_TRANSPORT, WALK]
        durationMinutes:
          type: integer
          example: 18
        transferCount:
          type: integer
          example: 1
        subPaths:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationRouteSubPathSummary'

    RecommendationInfrastructureDetails:
      type: object
      required: [infrastructureId, name, category, roadAddress, location, walkingMinutes]
      properties:
        infrastructureId:
          type: integer
          format: int64
          example: 10
        name:
          type: string
          nullable: true
          example: Campus pharmacy
        category:
          type: string
          nullable: true
          description: Infrastructure category enum string returned from the backend.
          enum: [CONVENIENT_STORE, MART, PHARMACY, HOSPITAL, LAUNDRY, CAFE, SUBWAY, BANK, GYM, KARAOKE, PC_ROOM, ETC]
        roadAddress:
          type: string
          nullable: true
          example: 10 Infra-ro, Suwon
        location:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CoordinateDto'
        walkingMinutes:
          type: integer
          nullable: true
          example: 4

    RecommendationRouteSubPathSummary:
      type: object
      properties:
        type:
          type: string
          description: Route subpath type derived from provider traffic type.
          enum: [SUBWAY, BUS, WALK, UNKNOWN]
        trafficType:
          type: integer
          example: 3
        time:
          type: integer
          example: 6
        startName:
          type: string
          nullable: true
        endName:
          type: string
          nullable: true
        lane:
          type: string
          nullable: true
        distance:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true

    RecommendationRouteDetailData:
      type: object
      required: [recommendationId, propertyId, targetPlaceId, transportMode, durationMinutes, detail, path]
      properties:
        recommendationId:
          type: integer
          format: int64
          example: 7001
        propertyId:
          type: integer
          format: int64
          example: 101
        targetPlaceId:
          type: integer
          format: int64
          example: 29
        transportMode:
          type: string
          description: Enum string. PUBLIC_TRANSPORT routes come from ODSAY. WALK routes come from TMAP pedestrian routing.
          enum: [PUBLIC_TRANSPORT, WALK]
        durationMinutes:
          type: integer
          example: 18
        detail:
          $ref: '#/components/schemas/RouteGeometryDetail'
        path:
          $ref: '#/components/schemas/RecommendationRoutePath'

    RouteGeometryDetail:
      type: string
      description: SUMMARY is simplified for list or overview maps and caps the route at 100 points. DETAIL is simplified for detailed maps and caps the route at 300 points.
      enum: [SUMMARY, DETAIL]
      default: SUMMARY

    RecommendationRoutePath:
      type: object
      required: [totalTime, transferCount, totalPointCount, pathList]
      properties:
        totalTime:
          type: integer
          example: 18
        transferCount:
          type: integer
          example: 1
        totalPointCount:
          type: integer
          description: Total number of returned geometry points after simplification and point-budget limiting.
          maximum: 300
          example: 120
        pathList:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationRouteSubPathDetail'

    RecommendationRouteSubPathDetail:
      type: object
      properties:
        type:
          type: string
          description: Route subpath type derived from provider traffic type.
          enum: [SUBWAY, BUS, WALK, UNKNOWN]
        trafficType:
          type: integer
          example: 3
        time:
          type: integer
          example: 6
        startName:
          type: string
          nullable: true
        endName:
          type: string
          nullable: true
        lane:
          type: string
          nullable: true
        distance:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true
        points:
          description: Simplified geometry points for this route step. All steps together stay within the point cap selected by the detail query.
          type: array
          items:
            $ref: '#/components/schemas/CoordinateDto'

