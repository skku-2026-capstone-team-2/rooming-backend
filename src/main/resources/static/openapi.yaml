openapi: 3.0.3
info:
  title: SKKU-ZIP API
  version: 0.1.0
  description: |
    SKKU-ZIP MVP API 명세 문서입니다.

    이 API 문서는 다음 기능을 포함합니다:
    - 사용자/관리자 로그인
    - 온보딩 주요 장소 등록
    - 자연어 조건 파싱
    - 추천 매물 검색
    - 지도 기반 매물/인프라 조회
    - 매물 상세 / 3D 모델 조회
    - 인프라 시각화
    - 관리자 매물 관리

servers:
  - url: http://localhost:8080/api/v1
    description: 로컬 개발 서버

tags:
  - name: Auth
    description: 인증 관련 API
  - name: Onboarding
    description: 장소 등록 및 사용자 선호 설정 API
  - name: Search
    description: 자연어 파싱 및 추천 검색 API
  - name: Map
    description: 지도 마커 조회 API
  - name: Property
    description: 매물 상세 조회 API
  - name: Infrastructure
    description: 인프라 및 거리 조회 API
  - name: Admin
    description: 관리자/공급자 API

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: 사용자 로그인
      description: 일반 사용자 로그인을 처리합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: 사용자 로그인 success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/auth/login:
    post:
      tags: [Auth]
      summary: 관리자 로그인
      description: 관리자/공급자 로그인을 처리합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: 관리자 로그인 success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /places/search:
    get:
      tags: [Onboarding]
      summary: 장소 검색
      description: 장소 검색 for onboarding and base place registration.
      parameters:
        - in: query
          name: keyword
          required: true
          schema:
            type: string
          example: 성균관대 정문
      responses:
        '200':
          description: 장소 검색 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceSearchResponse'

  /users/me/places:
    post:
      tags: [Onboarding]
      summary: 사용자 주요 장소 등록
      description: 캠퍼스 정문, 도서관 등 사용자의 주요 장소를 저장합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPlacesRequest'
      responses:
        '201':
          description: 사용자 주요 장소 저장 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonSuccessResponse'

  /users/me/preferences:
    post:
      tags: [Onboarding]
      summary: 사용자 선호 조건 저장
      description: 추천에 사용할 기본 선호 조건을 저장합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferenceRequest'
      responses:
        '201':
          description: 선호 조건 저장 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonSuccessResponse'

  /search/parse:
    post:
      tags: [Search]
      summary: 자연어 검색어 파싱
      description: 자연어 검색어를 구조화된 검색 조건으로 변환합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchParseRequest'
      responses:
        '200':
          description: 검색어 파싱 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchParseResponse'
        '400':
          description: 파싱 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /properties/search:
    post:
      tags: [Search]
      summary: 추천 매물 검색
      description: 구조화된 조건을 바탕으로 추천 매물을 검색하고 우선순위를 계산합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertySearchRequest'
      responses:
        '200':
          description: 매물 검색 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertySearchResponse'
        '400':
          description: 잘못된 검색 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /recommendations/explain:
    post:
      tags: [Search]
      summary: 추천 이유 설명
      description: 특정 매물이 추천된 이유를 생성합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationExplainRequest'
      responses:
        '200':
          description: 추천 이유 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationExplainResponse'

  /map/properties:
    get:
      tags: [Map]
      summary: 현재 지도 범위 내 매물 조회
      description: 현재 지도에 보이는 범위 내 매물 마커를 조회합니다.
      parameters:
        - $ref: '#/components/parameters/minLat'
        - $ref: '#/components/parameters/maxLat'
        - $ref: '#/components/parameters/minLng'
        - $ref: '#/components/parameters/maxLng'
      responses:
        '200':
          description: 매물 마커 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapPropertiesResponse'

  /map/infrastructures:
    get:
      tags: [Map]
      summary: 현재 지도 범위 내 인프라 조회
      description: 현재 지도에 보이는 범위 내 인프라 마커를 조회합니다.
      parameters:
        - $ref: '#/components/parameters/minLat'
        - $ref: '#/components/parameters/maxLat'
        - $ref: '#/components/parameters/minLng'
        - $ref: '#/components/parameters/maxLng'
        - in: query
          name: categories
          required: false
          schema:
            type: string
          description: 쉼표로 구분된 인프라 카테고리
          example: gym,cafe,convenience_store
      responses:
        '200':
          description: 인프라 마커 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapInfrastructuresResponse'

  /properties/{propertyId}:
    get:
      tags: [Property]
      summary: 매물 상세 조회
      description: 매물의 상세 정보를 조회합니다.
      parameters:
        - $ref: '#/components/parameters/propertyId'
      responses:
        '200':
          description: 매물 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetailResponse'
        '404':
          description: 매물을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /properties/{propertyId}/images:
    get:
      tags: [Property]
      summary: 매물 이미지 조회
      description: 매물 이미지 목록을 조회합니다.
      parameters:
        - $ref: '#/components/parameters/propertyId'
      responses:
        '200':
          description: 매물 이미지 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyImagesResponse'

  /properties/{propertyId}/3d:
    get:
      tags: [Property]
      summary: 매물 3D 모델 조회
      description: 매물의 3D 모델 정보를 조회합니다.
      parameters:
        - $ref: '#/components/parameters/propertyId'
      responses:
        '200':
          description: 매물 3D 모델 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property3DResponse'

  /properties/{propertyId}/infrastructures:
    get:
      tags: [Infrastructure]
      summary: 매물 기준 주변 인프라 조회
      description: 선택한 매물 주변 인프라를 조회합니다.
      parameters:
        - $ref: '#/components/parameters/propertyId'
        - in: query
          name: categories
          required: false
          schema:
            type: string
          example: gym,cafe
        - in: query
          name: radius
          required: false
          schema:
            type: integer
            default: 500
          description: 검색 반경(m)
      responses:
        '200':
          description: 주변 인프라 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyInfrastructureResponse'

  /properties/{propertyId}/distances:
    get:
      tags: [Infrastructure]
      summary: 사용자 주요 장소까지 거리 조회
      description: 매물에서 등록된 주요 장소까지의 거리/시간을 조회합니다.
      parameters:
        - $ref: '#/components/parameters/propertyId'
      responses:
        '200':
          description: 거리 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDistancesResponse'

  /admin/properties:
    post:
      tags: [Admin]
      summary: 매물 등록
      description: 관리자가 새로운 매물을 등록합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreatePropertyRequest'
      responses:
        '201':
          description: 매물 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonSuccessResponse'

  /admin/properties/{propertyId}:
    patch:
      tags: [Admin]
      summary: 매물 수정
      description: 관리자가 기존 매물을 수정합니다.
      parameters:
        - $ref: '#/components/parameters/propertyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdatePropertyRequest'
      responses:
        '200':
          description: 매물 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonSuccessResponse'

  /admin/properties/{propertyId}/3d:
    post:
      tags: [Admin]
      summary: 매물 3D 자산 등록
      description: 관리자가 매물의 3D 자산을 등록하거나 수정합니다.
      parameters:
        - $ref: '#/components/parameters/propertyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProperty3DRequest'
      responses:
        '201':
          description: 3D 자산 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonSuccessResponse'

components:
  parameters:
    propertyId:
      in: path
      name: propertyId
      required: true
      schema:
        type: integer
      example: 101
    minLat:
      in: query
      name: minLat
      required: true
      schema:
        type: number
        format: double
    maxLat:
      in: query
      name: maxLat
      required: true
      schema:
        type: number
        format: double
    minLng:
      in: query
      name: minLng
      required: true
      schema:
        type: number
        format: double
    maxLng:
      in: query
      name: maxLng
      required: true
      schema:
        type: number
        format: double

  schemas:
    CommonSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 요청이 성공했습니다.

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        errorCode:
          type: string
          example: INVALID_REQUEST
        message:
          type: string
          example: 잘못된 요청입니다.

    UserLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: user@example.com
        password:
          type: string
          example: 1234

    UserLoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            userId:
              type: integer
              example: 1
            role:
              type: string
              example: USER
            nickname:
              type: string
              example: 예진
            isFirstLogin:
              type: boolean
              example: true
        message:
          type: string
          example: 로그인에 성공했습니다.

    AdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: admin@example.com
        password:
          type: string
          example: admin1234

    AdminLoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            adminId:
              type: integer
              example: 1
            role:
              type: string
              example: ADMIN
        message:
          type: string
          example: 관리자 로그인에 성공했습니다.

    PlaceSearchResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            places:
              type: array
              items:
                $ref: '#/components/schemas/Place'
        message:
          type: string
          example: 장소 검색이 완료되었습니다.

    Place:
      type: object
      properties:
        placeId:
          type: string
          example: place_1
        name:
          type: string
          example: 성균관대학교 정문
        address:
          type: string
          example: 경기 수원시 장안구 서부로 2066
        latitude:
          type: number
          format: double
          example: 37.123
        longitude:
          type: number
          format: double
          example: 127.123

    UserPlacesRequest:
      type: object
      properties:
        places:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
                example: campus_gate
              latitude:
                type: number
                format: double
              longitude:
                type: number
                format: double
              isPrimary:
                type: boolean

    UserPreferenceRequest:
      type: object
      properties:
        maxTravelMinutes:
          type: integer
          example: 15
        monthlyRentMax:
          type: integer
          example: 60
        preferredInfrastructure:
          type: array
          items:
            type: string
          example: [gym, convenience_store]
        roomType:
          type: string
          example: one_room

    SearchParseRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          example: 정문에서 15분 이내고 헬스장 가까운 원룸 찾아줘

    SearchParseResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            parsedConditions:
              $ref: '#/components/schemas/ParsedConditions'
            unsupportedTokens:
              type: array
              items:
                type: string
            confidence:
              type: number
              format: float
              example: 0.94
        message:
          type: string
          example: 검색 조건 파싱이 완료되었습니다.

    ParsedConditions:
      type: object
      properties:
        basePlace:
          type: string
          example: 성균관대학교 정문
        basePlaceId:
          type: string
          example: place_1
        maxTravelMinutes:
          type: integer
          example: 15
        monthlyRentMax:
          type: integer
          example: 60
        preferredInfrastructure:
          type: array
          items:
            type: string
          example: [gym, convenience_store]
        roomType:
          type: string
          example: one_room

    PropertySearchRequest:
      type: object
      required: [conditions]
      properties:
        conditions:
          $ref: '#/components/schemas/ParsedConditions'
        sortBy:
          type: string
          enum: [recommendation, distance, price]
          example: recommendation
        limit:
          type: integer
          example: 3

    PropertySearchResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            totalCount:
              type: integer
              example: 12
            properties:
              type: array
              items:
                $ref: '#/components/schemas/PropertySummary'
        message:
          type: string
          example: 매물 검색이 완료되었습니다.

    PropertySummary:
      type: object
      properties:
        propertyId:
          type: integer
          example: 101
        title:
          type: string
          example: 성대 정문 도보권 원룸
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        deposit:
          type: integer
          example: 500
        monthlyRent:
          type: integer
          example: 55
        maintenanceFee:
          type: integer
          example: 5
        has3DModel:
          type: boolean
          example: true
        recommendationScore:
          type: number
          format: float
          example: 92.4
        matchedConditions:
          type: array
          items:
            type: string

    RecommendationExplainRequest:
      type: object
      required: [propertyId, conditions]
      properties:
        propertyId:
          type: integer
          example: 101
        conditions:
          $ref: '#/components/schemas/ParsedConditions'

    RecommendationExplainResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            propertyId:
              type: integer
              example: 101
            summary:
              type: string
              example: 이 매물은 학교 정문까지 도보 12분이며, 헬스장과 편의점이 모두 가까워 추천되었습니다.
            evidences:
              type: array
              items:
                type: string
        message:
          type: string
          example: 추천 이유 생성이 완료되었습니다.

    MapPropertiesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            properties:
              type: array
              items:
                $ref: '#/components/schemas/PropertyMarker'
        message:
          type: string
          example: 지도 내 매물 조회 성공

    PropertyMarker:
      type: object
      properties:
        propertyId:
          type: integer
        title:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        deposit:
          type: integer
        monthlyRent:
          type: integer

    MapInfrastructuresResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            infrastructures:
              type: array
              items:
                $ref: '#/components/schemas/InfrastructureItem'
        message:
          type: string
          example: 지도 내 인프라 조회 성공

    PropertyDetailResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/PropertyDetail'
        message:
          type: string
          example: 매물 상세 조회 성공

    PropertyDetail:
      type: object
      properties:
        propertyId:
          type: integer
        title:
          type: string
        address:
          type: string
        deposit:
          type: integer
        monthlyRent:
          type: integer
        maintenanceFee:
          type: integer
        areaM2:
          type: number
          format: float
        roomType:
          type: string
        floorInfo:
          type: string
        description:
          type: string
        has3DModel:
          type: boolean

    PropertyImagesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            propertyId:
              type: integer
            images:
              type: array
              items:
                $ref: '#/components/schemas/PropertyImage'
        message:
          type: string
          example: 매물 이미지 조회 성공

    PropertyImage:
      type: object
      properties:
        imageId:
          type: integer
        imageUrl:
          type: string
          example: https://example.com/image1.jpg
        imageOrder:
          type: integer
          example: 1

    Property3DResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            propertyId:
              type: integer
            has3DModel:
              type: boolean
            modelType:
              type: string
              example: spline
            modelUrl:
              type: string
            previewImageUrl:
              type: string
        message:
          type: string
