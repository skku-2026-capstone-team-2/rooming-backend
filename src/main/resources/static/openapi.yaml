    BrokerPropertyCreateRequest:
      type: object
      description: Request body for verified brokers to post a property. transactionType is not used; send tradeType. For DEPOSIT_BASIS, monthlyRent can be omitted or sent as 0 and the server stores/returns 0.
      required: [title, tradeType, depositAmount, areaM2, roadAddress, location]
      properties:
        title:
          type: string
          minLength: 1
          example: 캠퍼스빌 502호
        propertyType:
          type: string
          nullable: true
          description: Free-form room/property type string used by the frontend, for example one_room.
          example: one_room
        tradeType:
          type: string
          description: Enum string. MONTHLY_RENT means monthly rent with depositAmount and monthlyRent. DEPOSIT_BASIS means deposit-basis rent; monthlyRent is stored and returned as 0.
          enum: [MONTHLY_RENT, DEPOSIT_BASIS]
          example: MONTHLY_RENT
        depositAmount:
          type: integer
          description: Deposit amount. Unit follows the frontend/backend product convention.
          example: 300
        monthlyRent:
          type: integer
          nullable: true
          description: Monthly rent amount for MONTHLY_RENT. For DEPOSIT_BASIS, omit it or send 0; the server returns 0.
          example: 48
        tags:
          type: array
          nullable: true
          description: Free-form search/display tags.
          items:
            type: string
          example: [캠퍼스, 원룸]
        maintenanceFee:
          type: integer
          nullable: true
          example: 5
        areaM2:
          type: number
          format: double
          example: 18.0
        floorInfo:
          type: string
          nullable: true
          example: 5층
        roomCount:
          type: integer
          nullable: true
          example: 1
        bathroomCount:
          type: integer
          nullable: true
          example: 1
        direction:
          type: string
          nullable: true
          description: Free-form orientation value from the frontend, for example SOUTH.
          example: SOUTH
        availableFrom:
          type: string
          nullable: true
          description: Free-form available date string. Current backend stores no separate field for this value.
          example: 2026-06-01
        description:
          type: string
          nullable: true
          example: 캠퍼스 접근성이 좋은 원룸입니다.
        splineUrl:
          type: string
          nullable: true
          example: https://prod.spline.design/example-room/scene.splinecode
        roadAddress:
          type: string
          minLength: 1
          example: 경기도 수원시 장안구 천천동 45-2
        location:
          $ref: '#/components/schemas/CoordinateDto'

    BrokerPropertyResponse:
