<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>SKKU-ZIP</title>
    <script type="module"
            src="https://unpkg.com/@splinetool/viewer@1.9.96/build/spline-viewer.js">
    </script>
    <style>
        body { font-family: sans-serif; padding: 40px; background: #f5f5f5; }
        h1 { margin-bottom: 24px; }
        .room-list a {
            display: inline-block; margin-right: 12px;
            padding: 12px 24px; background: #6C7FFF;
            color: white; border-radius: 8px; text-decoration: none;
            font-weight: 600;
        }
        #viewer-section { margin-top: 40px; display: none; }
        /*spline-viewer { width: 100%; height: 600px; border-radius: 12px; }*/
    </style>
</head>
<body>
<h1>SKKU-ZIP 매물 목록</h1>

<div class="room-list">
    <a href="#" onclick="loadRoom('101')">room1</a>
    <a href="#" onclick="loadRoom('102')">room2</a>
    <a href="#" onclick="loadRoom('103')">room3</a>
</div>

<div id="viewer-section">
    <h2 id="room-title"></h2>
    <spline-viewer id="spline" url=""></spline-viewer>
</div>

<script>
    async function loadRoom(name) {
        const res = await fetch(`/api/v1/properties/${name}/3d`);
        if (!res.ok) { alert('매물을 찾을 수 없어요'); return; }

        const result = await res.json();
        const property3D = result.data;

        document.getElementById('room-title').textContent = `매물 ID: ${property3D.propertyId}`;
        document.getElementById('spline').setAttribute('url', property3D.modelUrl);
        document.getElementById('viewer-section').style.display = 'block';
    }
</script>
</body>
</html>
