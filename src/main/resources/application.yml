spring:
  config:
    import: optional:file:.env[.properties]
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/rooming_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
jwt:
  secret: b3JkbmFuY2UtZmlnaHQtbWlsa2Etc2VjcmV0LWtleS1mb3ItYnVsbWFuc29kYS1wcm9qZWN0LWp3dC1zaWdu
  access-token-validity-in-seconds: 86400

app:
  frontend:
    redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:3000/oauth2/redirect}
    allowed-origin: ${FRONTEND_ALLOWED_ORIGIN:http://localhost:3000}
  auth:
    access-token-cookie-name: ROOMING_ACCESS_TOKEN
    oauth-account-type-cookie-name: ROOMING_OAUTH_ACCOUNT_TYPE
    cookie-secure: ${AUTH_COOKIE_SECURE:false}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    url: /openapi.yaml

server:
  port: 8080
