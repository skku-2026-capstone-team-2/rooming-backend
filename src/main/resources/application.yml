spring:
  config:
    import: optional:file:.env[.properties]
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rooming_db}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        show_sql: ${HIBERNATE_SHOW_SQL:false}
    database-platform: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
  cloud:
    aws:
      region:
        static: ${PROPERTY_IMAGE_S3_REGION:${AWS_REGION:ap-northeast-2}}
jwt:
  secret: ${SECRET_HASH_KEY}
  access-token-validity-in-seconds: 86400

app:
  frontend:
    redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:https://rooming-frontend.vercel.app/}
    local-redirect-uri: ${OAUTH2_LOCAL_SUCCESS_REDIRECT_URI:http://localhost:3000/}
    allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:${FRONTEND_ALLOWED_ORIGIN:https://rooming-frontend.vercel.app}},https://rooming.cloud,http://localhost:3000,http://localhost:5173
  auth:
    access-token-cookie-name: ROOMING_ACCESS_TOKEN
    oauth-account-type-cookie-name: ROOMING_OAUTH_ACCOUNT_TYPE
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:None}
    redirect-access-token: ${OAUTH2_REDIRECT_ACCESS_TOKEN:false}

tmap:
  api-key: ${TMAP_API_KEY}
  base-url: https://apis.openapi.sk.com/tmap

odsay:
  api-key: ${ODSAY_API_KEY}
  base-url: https://api.odsay.com/v1/api

rooming:
  ai:
    base-url: ${ROOMING_AI_BASE_URL:http://43.202.209.198:8000}
  property-images:
    s3:
      bucket: ${PROPERTY_IMAGE_S3_BUCKET:rooming-property-image}
      region: ${PROPERTY_IMAGE_S3_REGION:${AWS_REGION:ap-northeast-2}}
    public-base-url: ${PROPERTY_IMAGE_PUBLIC_BASE_URL:}
  infrastructure-sync:
    daily:
      enabled: ${INFRASTRUCTURE_SYNC_DAILY_ENABLED:true}
      cron: ${INFRASTRUCTURE_SYNC_DAILY_CRON:0 0 3 * * *}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    url: /openapi.yaml

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}

kind: Application
